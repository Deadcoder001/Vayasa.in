name: Deploy Vayasa to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:


jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Production Bundle
        run: npm run build

      - name: 🚀 Deploy to Hostinger via LFTP
        run: |
          sudo apt-get update -y && sudo apt-get install -y lftp
          lftp -c '
            set ssl:verify-certificate no;
            set net:timeout 30;
            set net:max-retries 3;
            set ftp:passive-mode true;
            open -u "${{ secrets.FTP_USERNAME }}","${{ secrets.FTP_PASSWORD }}" "${{ secrets.FTP_SERVER }}";
            echo "--- Current Directory ---";
            pwd;
            echo "--- Cleaning up accidental nested public_html folder ---";
            rm -rf public_html || true;
            echo "--- Uploading directly to root ---";
            mirror -R --verbose ./dist/ ./;
            echo "--- Verification: Files in root ---";
            ls;
          '


